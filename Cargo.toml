[package]
name = "media-lite"
version = "0.1.6"
edition = "2021"
description = "A desktop Emby client with unlimited servers"
repository = "https://github.com/WangYiQian0821/media-lite"

[dependencies]
eframe = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libloading = "0.8"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Graphics_Gdi"] }
xml-rs = "0.8"
regex = "1"
semver = "1"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
